spring:
  application:
    name: agri-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agriplataforma}
    username: ${SPRING_DATASOURCE_USERNAME:agri}
    password: ${SPRING_DATASOURCE_PASSWORD:agri}
    hikari:
      initialization-fail-timeout: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: true
    locations: classpath:db/migration/tenant
  docker:
    compose:
      enabled: false
  sql:
    init:
      mode: never

server:
  servlet:
    session:
      tracking-modes: cookie
      timeout: 30m
      cookie:
        name: sessao
        http-only: true
        secure: true
        same-site: lax

agriplataforma:
  idTenantSemeado: ${AGRIPLATAFORMA_ID_TENANT_SEMEADO:11111111-1111-1111-1111-111111111111}


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ecs
